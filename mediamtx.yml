logLevel: warn
api: yes
apiAddress: :9997
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: no
hls: no
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
srt: no
moq: no
paths: {}
authMethod: internal
# Trusted service network only: API, RTSP and WHEP HTTP must never be published.
# Browser signaling is authenticated by the application's /api/media proxy.
authInternalUsers:
  - user: any
    ips: []
    permissions:
      - action: read
      - action: api
