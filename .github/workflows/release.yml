name: Release image
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: dockerhub-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      stable: ${{ steps.release.outputs.stable }}
      aliases: ${{ steps.release.outputs.aliases }}
      platforms: ${{ steps.release.outputs.platforms }}
      license: ${{ steps.release.outputs.license }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release commit on master
        run: git merge-base --is-ancestor HEAD origin/master
      - name: Validate version, license and publication settings
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_ID: ${{ github.event.release.id }}
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKER_PLATFORMS: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}
        run: python3 scripts/release_check.py
  checks:
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: [verify, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Configure required reviewers. This environment owns the Docker Hub token.
    environment: dockerhub
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        if: contains(needs.verify.outputs.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v4
      - name: Generate release tags and OCI metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ needs.verify.outputs.aliases == 'true' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.aliases == 'true' }}
          labels: |
            org.opencontainers.image.title=TupoNVR
            org.opencontainers.image.description=Lightweight self-hosted RTSP recording and synchronized archive investigation
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=${{ needs.verify.outputs.license }}
      - name: Authenticate for this trusted publishing job only
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ needs.verify.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
